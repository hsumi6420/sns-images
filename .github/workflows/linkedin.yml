name: LinkedIn Auto Post Test

on:
  workflow_dispatch:

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Get User ID
        run: |
          USER_ID=$(curl -s -H "Authorization: Bearer ${{ secrets.LINKEDIN_ACCESS_TOKEN }}" https://api.linkedin.com/v2/me | jq -r '.id')
          echo "USER_ID=$USER_ID" >> $GITHUB_ENV

      - name: Post to LinkedIn
        run: |
          RESPONSE=$(curl -s -w "\n%{http_code}" -X POST https://api.linkedin.com/v2/ugcPosts \
            -H "Authorization: Bearer ${{ secrets.LINKEDIN_ACCESS_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{
              "author": "urn:li:person:'$USER_ID'",
              "lifecycleState": "PUBLISHED",
              "specificContent": {
                "com.linkedin.ugc.ShareContent": {
                  "shareCommentary": {
                    "text": "GitHub Actionsからの自動投稿テストです！🚀"
                  },
                  "shareMediaCategory": "NONE"
                }
              },
              "visibility": {
                "com.linkedin.ugc.MemberNetworkVisibility": "PUBLIC"
              }
            }')
          
          HTTP_STATUS=$(echo "$RESPONSE" | tail -n1)
          BODY=$(echo "$RESPONSE" | sed '$d')
          echo "$BODY"
          
          if [ "$HTTP_STATUS" -ne 201 ]; then
            echo "Failed with HTTP status $HTTP_STATUS"
            exit 1
          fi
